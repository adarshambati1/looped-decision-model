[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "looped-decision-model"
version = "0.1.0"
description = "Auditable experiments in adaptive looped decision models"
requires-python = ">=3.11,<3.13"
dependencies = ["numpy>=1.26,<3", "pydantic>=2.10,<3", "fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1", "ruff>=0.9"]

[tool.hatch.build.targets.wheel]
packages = ["src/looped_decision"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
